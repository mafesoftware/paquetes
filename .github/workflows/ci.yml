name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: typecheck, test (cobertura), build, lint
    runs-on: ubuntu-latest
    # Puerto 5475 (no 5432/5433): en esta máquina y en CI conviven varios
    # Postgres de otros proyectos (ver `~/.claude/CLAUDE.md`). Ningún paquete
    # usa todavía este servicio (los paquetes con subpath /drizzle llegan en
    # P.8+), pero lo dejamos funcionando desde ya para no tener que tocar este
    # workflow cuando lleguen. Los tests de hoy deben pasar sin usarlo.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paquetes
          POSTGRES_PASSWORD: paquetes
          POSTGRES_DB: paquetes
        ports:
          - 5475:5432
        options: >-
          --health-cmd "pg_isready -U paquetes -d paquetes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test con cobertura (umbral 95% en el núcleo de cada paquete)
        run: bun run test -- --coverage

      - name: Build (cada packages/*)
        run: bun run build

      - name: Lint de paquetes (publint + attw --pack)
        run: bun run lint:paquetes

  changeset:
    name: changeset (PRs que tocan packages/)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 = toda la historia de todas las ramas y tags (necesario para que
          # `origin/main` exista y `changeset status --since` pueda diffear).
          fetch-depth: 0

      - name: Instalar bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar changeset si el PR toca packages/
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^packages/'; then
            echo "El PR toca packages/; exigiendo changeset."
            bunx changeset status --since=origin/main
          else
            echo "El PR no toca packages/; no se exige changeset."
          fi
