name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: typecheck, test (cobertura), build, lint
    runs-on: ubuntu-latest
    # Puerto 5475 (no 5432/5433): en esta máquina y en CI conviven varios
    # Postgres de otros proyectos (ver `~/.claude/CLAUDE.md`). Desde P.8
    # (`@mafesoftware/tenant`, primer paquete con subpath /drizzle) los tests
    # de `packages/*/tests/drizzle/` lo usan de verdad (DATABASE_URL_TEST más
    # abajo); GitHub Actions espera solo a que el healthcheck del servicio
    # pase antes de correr los steps del job, así que no hace falta un paso
    # de espera aparte.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paquetes
          POSTGRES_PASSWORD: paquetes
          POSTGRES_DB: paquetes
        ports:
          - 5475:5432
        options: >-
          --health-cmd "pg_isready -U paquetes -d paquetes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test con cobertura (umbral 95% en el núcleo de cada paquete)
        # DATABASE_URL_TEST apunta al servicio "postgres" de arriba (mismas
        # credenciales que sus env), no al db_test local del docker-compose.yml
        # de la raíz (ese es para levantarlo a mano en esta máquina).
        run: bun run test -- --coverage
        env:
          DATABASE_URL_TEST: postgres://paquetes:paquetes@localhost:5475/paquetes

      - name: Build (cada packages/*)
        run: bun run build

      - name: Lint de paquetes (publint + attw --pack)
        run: bun run lint:paquetes

  changeset:
    name: changeset (PRs que tocan packages/)
    # El PR automático "Version Packages" que abre changesets/action (rama
    # `changeset-release/main`, actor `github-actions[bot]`) toca packages/
    # (bumpea version en cada package.json y CHANGELOG.md) pero por
    # definición no trae changesets nuevos propios — los está consumiendo,
    # no agregando. Sin esta excepción, este job se auto-bloquearía siempre.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 = toda la historia de todas las ramas y tags (necesario para que
          # `origin/<base>` exista y `changeset status --since` pueda diffear).
          fetch-depth: 0

      - name: Instalar bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar changeset si el PR toca packages/
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff --name-only "${BASE}...HEAD" | grep -q '^packages/'; then
            echo "El PR toca packages/; exigiendo changeset."
            bunx changeset status --since="${BASE}"
          else
            echo "El PR no toca packages/; no se exige changeset."
          fi
