name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Un solo release a la vez: dos pushes a main casi simultáneos (o un push
# mientras un release anterior sigue corriendo) no deben pisarse abriendo
# dos PRs "Version Packages" a la vez o publicando dos veces en paralelo.
# `cancel-in-progress: false` a propósito: un release en curso (sobre todo
# si ya llegó a `npm publish`) no se cancela nunca, se deja terminar; el
# run nuevo espera en cola.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Changesets — PR de versiones / publicación con provenance (OIDC)
    runs-on: ubuntu-latest
    # Mismo servicio que ci.yml (puerto 5475): `bun run test`, que corre
    # acá ANTES de publicar, incluye los tests de `packages/*/tests/drizzle/`
    # que necesitan Postgres real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paquetes
          POSTGRES_PASSWORD: paquetes
          POSTGRES_DB: paquetes
        ports:
          - 5475:5432
        options: >-
          --health-cmd "pg_isready -U paquetes -d paquetes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      # npm reciente (>= 11.5): necesario para "trusted publishing" por OIDC
      # sin token. Versión pineada (no "latest"): un release no debería
      # poder romperse porque npm sacó una versión nueva justo ese día —
      # subirla es una decisión aparte, deliberada.
      - name: Instalar Node (para una versión de npm con soporte OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Actualizar npm (soporte de OIDC trusted publishing)
        run: npm install -g npm@11.5.2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # Gate antes de publicar: si typecheck/test/build no pasan, ni se
      # intenta versionar/publicar. `changesets/action` (más abajo) no corre
      # ninguno de estos tres por su cuenta — `publish: bun run release`
      # hace `build` otra vez internamente (antes de `reescribir-workspace.ts`
      # + `changeset publish`), pero typecheck/test nunca corrían en este
      # workflow antes de este fix.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
        env:
          DATABASE_URL_TEST: postgres://paquetes:paquetes@localhost:5475/paquetes

      - name: Build (cada packages/*)
        run: bun run build

      # `changesets/action` en modo "solo publish" (sin PR de versiones
      # pendiente) corre `publish`; cuando hay changesets sin versionar,
      # abre/actualiza el PR "Version Packages" y no publica todavía. Al
      # mergear ese PR a main, este mismo workflow vuelve a correr y esta vez
      # sí publica.
      - name: Versionar o publicar
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Variable de config de npm (npm_config_provenance): equivalente a
          # pasarle `--provenance` a cada `npm publish` que dispare
          # `changeset publish` dentro de `bun run release`, sin tener que
          # tocar ese comando. Con Trusted Publisher configurado en npmjs.com
          # (ver README § Publicar) no hace falta NPM_TOKEN: la identidad la
          # prueba el OIDC de `permissions.id-token: write` de este job.
          NPM_CONFIG_PROVENANCE: true
